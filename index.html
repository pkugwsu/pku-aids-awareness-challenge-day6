<title>“艾”的选择题</title>
<script>
// 题库：按原文保存，answer 为正确选项字母。
const QUESTIONS = [
{question:'HIV的传播途径有几种，以下哪项正确？',options:['3种：性接触、血液、母婴','2种：性接触、血液','4种：性接触、血液、母婴、共用卫生间','1种：性接触'],answer:'A',explanation:'HIV传播途径仅限性接触、血液和母婴三种，共用卫生间等日常接触不传播。'},
{question:'被蚊子叮咬会感染HIV吗？',options:['会，蚊子口器残留的血液足以传播','只有在蚊虫密集地区才会','会，但仅限于热带地区','不会，HIV在蚊子体内无法复制存活，且蚊子吸血时不会将已吸入的血液注入人体'],answer:'D',explanation:'HIV进入蚊子体内后无法复制，且蚊子的食管（吸入血液）与唾液管（注入唾液）是完全独立的两条通道，不会把上一个人的血"注射"给下一个人。'},
{question:'HIV在干燥的日常物体表面（如桌面、门把手）上，感染活性通常能维持多久？',options:['数天至数周','通常10—20分钟内失活','数小时至24小时','只要血液未干，就可存活数月'],answer:'B',explanation:'中国CDC系统资料明确，在干燥条件下HIV通常10—20分钟即死亡。需要注意区分：含高浓度病毒的未干燥液体在室温下可存活更久，但"干燥物体表面"上微量血液会迅速干燥，不具备传播条件。'},
{question:'"唾液不传播HIV"最准确的科学解释是？',options:['唾液中完全不含HIV病毒颗粒','只有血液中的HIV才具有传染性，其他体液中的HIV都是"死病毒"','唾液中的HIV浓度极低，达不到感染剂量，且唾液本身含有抑制HIV的因子','口腔黏膜是一层任何病毒都无法穿透的绝对屏障'],answer:'C',explanation:'HIV可以在唾液中被检测到，但浓度极其微小，"不足以达到感染剂量"。A的"完全不含"不准确；B把"浓度不足"偷换为"死病毒"；D的"绝对屏障"过于绝对。'},
{question:'中国CDC资料指出，含有HIV的血液在室温下放置14天后，"其中的病毒可能仍然存活"。这一事实与"日常接触不传播"是否矛盾？最准确的解释是？',options:['不矛盾：该数据描述的是未干燥的含有机物液体在特定条件下的存活，而一旦血液干燥，病毒在10—20分钟内即死亡；日常接触不涉及足量未干燥血液进入体内','矛盾，说明日常接触确实存在风险','不矛盾，因为那14天里病毒已经失去全部感染活性','矛盾，说明中国CDC的数据自相矛盾'],answer:'A',explanation:'中国CDC同一段资料同时给出了两个条件：室温下血清/血浆等含有机物液体中感染活力可维持14天；但干燥条件下10—20分钟死亡。日常物体表面上的微量血液会迅速干燥，不具备传播条件。B和D混淆了"存活"与"传播"；C错误，资料说的是"可能仍然存活"。'},
{question:'暴露后阻断（PEP）的启动时限和疗程分别是？',options:['24小时内启动，服用14天','7天内启动，服用7天','没有时限，只要检测阴性就不需要服药','72小时内启动，服用28天'],answer:'D',explanation:'PEP应在暴露后72小时内启动，疗程28天，越早启动效果越好。'},
{question:'服用PEP期间，如果出现轻微的恶心、头晕，正确的做法是？',options:['坚持不服药，因为副作用说明药物无效','立即停药，等症状消失后再决定是否继续','自行减半剂量继续服用','联系医生反馈，由医生评估是否需要调整方案或对症处理，不自行停药'],answer:'D',explanation:'PEP必须连续服满28天，擅自停药会造成药物浓度断档。因不良反应需要更换方案时，必须在有PEP经验的专科医生指导下进行，不可自行换药或停药。'},
{question:'某人服用PEP期间，在暴露后第4周做四代HIV抗原抗体检测，结果为阴性。最准确的解读是？',options:['4周阴性即可完全排除，PEP不影响检测','服用PEP的人做四代检测没有意义，结果一定是假阴性','可停药，因为4周阴性已经说明阻断成功','4周阴性是很好的信号，但服用PEP可能推迟抗体阳转，通常仍需随访至12周完成最终排除'],answer:'D',explanation:'服用PEP会推迟抗体的阳转时间，随访通常需要延长至12周。A忽略了PEP对检测判读的影响；B把"可能推迟"夸大为"一定假阴性"；C把"检测信号好"等同于"可以提前停药"。'},
{question:'"PEP的阻断失败率约0.5%"这一数据，最准确的理解是？',options:['该数据来自对1535名MSM的观察性研究的归因分析：8例被视为"潜在PEP失败"，折算为约0.5%；该人群中其他血清阳转多与完成PEP后持续的高危行为有关，不能把0.5%理解为"服药者的总感染率"','每1000名服用PEP的人中，最终只有5人感染','0.5%意味着PEP几乎没有效果','服满28天后，感染概率是0.5%'],answer:'A',explanation:'0.5%是归因于PEP失败的估计值，而非"总感染率"。B把归因失败率偷换为总感染率；C严重低估PEP的防护价值；D把群体估计值误读为个体概率。'},
{question:'关于PEP的启动时间与效果的关系，下列哪一项最准确？',options:['若在72小时内启动，2小时和70小时的效果相同','超过24小时启动就完全无效','越早启动效果越好；72小时是"最迟可以启动"的边界，而非"效果等同"的保证线','效果只取决于是否服满28天，与何时启动无关'],answer:'C',explanation:'PEP的核心原则是尽早启动，72小时是"最迟边界"，阻断效果随启动延迟而下降。A把"最迟边界"偷换为"效果等同线"；B的"24小时完全无效"与指南不符；D否定了启动时间的独立影响。'},
{question:'关于PrEP（暴露前预防）的有效性，下列哪一项最准确？',options:['PrEP的有效性接近100%，服用后可以不再使用安全套','PrEP在真实世界中普遍只有约50%有效，因为多数人难以坚持每日服药','PrEP只能预防血液传播，对性传播无效','在严格按方案服药、不漏服的前提下，口服PrEP预防HIV感染的有效性可超过90%'],answer:'D',explanation:'Lancet刊载的指南资料明确指出：完美依从下PrEP有效性可超过90%，随着依从性下降，保护力随之降低。A的"接近100%"和"可以不使用安全套"是危险的过度承诺；B混淆了"效力"与"真实世界效果"；C完全错误，PrEP的核心适应证恰恰是性传播预防。'},
{question:'关于"非正规场所纹身/穿孔"与HIV传播风险的关系，下列哪一项最准确？',options:['纹身和穿孔一定会传播HIV，因为必然出血','感染风险主要取决于是否使用了"一次性针头"。如果确认纹身师换了新的针头，则感染HIV风险几乎为零','风险的关键不在于"是否出血"，而在于器械是否经过严格灭菌；非正规场所重复使用未灭菌器械，才构成血液传播条件','纹身颜料本身可能携带HIV，构成了传播媒介'],answer:'C',explanation:'非正规纹身/穿孔的风险核心是器械灭菌不可靠，残留的微量血液可能通过皮肤破损进入下一位顾客体内。A的"一定会传播"过于绝对；B忽略了除针头之外的器械（色料杯、手柄等）和操作环境的污染可能；D错误，HIV传播不通过纹身颜料本身。'},
{question:'关于共用剃须刀/牙刷的HIV传播风险，下列哪一项最准确？',options:['风险与共用注射器相同，都是高效传播途径','共用牙刷和剃须刀不存在风险，因为病毒量太低','只有剃须刀有风险，牙刷没有风险','存在理论上的血液暴露风险，但实际传播概率极低，属于低危行为'],answer:'D',explanation:'沈阳市疾控的表述是"可能存在极低概率的感染风险，因此严禁共用"。其他来源也指出"共用剃须刀确实存在理论上的血液暴露风险，但实际造成HIV传播的概率极低"，同时共用这类物品"容易传播其他疾病"。A高估了风险；B否定了理论风险的存在；C试图在牙刷和剃须刀之间做无依据的风险排序，且忽略了牙刷同样可能造成牙龈出血。'}
];
// 游戏参数：修改以下常量即可调整抽题数量和每题限时。
const QUESTION_COUNT = 10;
const TIME_LIMIT = 45;
const POINTS = 1;
</script>
<style>
:root{--bg:#F4FBF7;--green:#3FB59B;--mint:#A8DFC8;--ink:#23403A;--muted:#6C8A82;--line:#DCEEE7;--red:#E4564D;--shadow:0 6px 20px rgba(35,64,58,.08)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;line-height:1.65;overflow-wrap:anywhere}
body::before,body::after{content:"";position:fixed;z-index:-1;width:220px;height:110px;background:var(--green);opacity:.07;border-radius:100% 0 100% 0;pointer-events:none}
body::before{top:0;left:-90px;transform:rotate(35deg)}
body::after{bottom:0;right:-90px;transform:rotate(35deg)}
[hidden]{display:none!important}
main{width:min(100%,760px);margin:0 auto;padding:20px}
.screen{min-width:0}
.center-screen{min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);display:flex;align-items:center;justify-content:center}
.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.hero{text-align:center;max-width:560px;padding:42px 28px}
.ribbon{width:112px;height:138px;display:block;margin:0 auto 10px}
.caption{color:var(--muted);font-size:13px;margin:0 0 22px}
h1{font-size:clamp(25px,5.5vw,34px);line-height:1.35;letter-spacing:-.025em;margin:0 0 16px}
h2{font-size:22px;line-height:1.45;margin:0 0 16px}
p{margin:0 0 16px}
.subtitle{color:var(--muted);font-size:15px;margin-bottom:28px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.btn{border:0;border-radius:16px;background:var(--green);color:#fff;font-weight:700;padding:14px 18px;width:100%;min-height:50px;transition:transform .15s,box-shadow .15s;background-clip:padding-box}
.btn:hover{box-shadow:0 6px 16px rgba(63,181,155,.24);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.form-card{max-width:480px}
label{display:block;font-weight:700;margin-bottom:7px}
input{width:100%;min-width:0;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fbfefa;color:var(--ink);font-size:16px}
input[aria-invalid="true"]{border-color:var(--red)}
.field{margin:0 0 16px}
.error{color:#b43b34;font-size:13px;min-height:21px;margin:4px 0 0}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 16px;margin-bottom:10px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:22px;color:#248a74;display:flex;align-items:center;gap:6px}
.timer small{font-size:13px}
.timer.urgent{color:#bf7629;animation:pulse 1s ease-in-out infinite}
.timer.urgent.stopped{animation:none}
@keyframes pulse{50%{opacity:.68}}
.track{height:8px;background:#dceee7;border-radius:99px;overflow:hidden;margin-top:10px}
#timeBar{height:100%;width:100%;background:var(--green);border-radius:99px;transition:width .3s linear}
#timeBar.urgent{background:#e9a04c}
.question-card{padding:22px}
#questionText{font-size:clamp(19px,3.8vw,24px);margin-bottom:20px}
.options{display:grid;gap:12px}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-width:0;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;color:var(--ink);transition:background .15s,border .15s,transform .15s;line-height:1.65}
.option:not(:disabled):hover{border-color:var(--green);background:#f0faf6;transform:translateY(-1px)}
.option:disabled{cursor:default;opacity:1}
.letter{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:#edf8f3;color:#287d6a;font-weight:700}
.option-text{flex:1;min-width:0;padding-top:2px}
.option.correct{background:#e5f7ef;border-color:var(--green)}
.option.correct .letter{background:var(--green);color:#fff}
.option.wrong{background:#fff0ee;border-color:var(--red)}
.option.wrong .letter{background:var(--red);color:#fff}
.reveal{margin-top:16px;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px}
.reveal-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px;font-weight:700}
.earned{color:#23826d}
#explanation{max-height:40vh;overflow-y:auto;line-height:1.8;padding-right:4px;margin-bottom:16px}
#feedback{color:var(--muted);font-size:14px;margin-bottom:9px}
.result{padding-top:12px;padding-bottom:28px}
.score-card{text-align:center}
.identity{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;color:var(--muted);font-size:14px}
.score{color:#278a74;font-size:72px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;margin-top:18px}
.score small{font-size:22px;font-weight:600;color:var(--muted)}
#scoreComment{margin:16px 0 0;font-weight:700}
.detail-card{margin-top:16px;padding:20px}
.detail-list{display:grid;gap:0}
.detail-row{padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.detail-row:last-child{border-bottom:0}
.detail-title{display:flex;gap:8px;align-items:center;min-width:0;font-weight:700}
.detail-no{flex:0 0 28px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.badge{flex-shrink:0;padding:2px 8px;border-radius:8px;font-size:12px;color:#247b67;background:#e6f7ef}
.badge.bad{color:#b43b34;background:#fff0ee}
.detail-answer{color:var(--muted);font-size:13px;margin:4px 0 0 36px}
.actions{display:grid;gap:10px;margin-top:16px}
@media(max-width:480px){main{padding:14px}.center-screen{min-height:calc(100dvh - 28px)}.card,.question-card{padding:18px}.hero{padding:32px 20px}.option{padding:12px;gap:10px}.reveal{padding:16px}.score{font-size:62px}.topbar{padding-top:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.review-option{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.6;background:#fff}

.review-explanation strong,.review-explanation span{display:block}
.review-explanation strong{color:#a91d2c;margin-bottom:5px}

<script>
// 页面与游戏状态全部在本地内存中管理。
const $ = id => document.getElementById(id);
const screens = ['welcome','registration','quiz','results'];
const letters = ['A','B','C','D'];
const count = Math.min(QUESTION_COUNT, QUESTIONS.length);
let player = {name:'',id:''};
let selectedQuestions = [];
let records = [];
let index = 0;
let intervalId = null;
let deadline = 0;
let locked = false;
$('welcomeText').textContent = '本次共 '+count+' 题，每题限时 '+TIME_LIMIT+' 秒，答完即可看到解析。';

function showScreen(id) {
  screens.forEach(screen => { $(screen).hidden = screen !== id; });
  window.scrollTo(0,0);
}
function stopTimer() {
  clearInterval(intervalId);
  intervalId = null;
}
// Fisher–Yates 洗牌，再截取指定数量，保证同一局不重复。
function drawQuestions() {
  const shuffled = QUESTIONS.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  return shuffled.slice(0,count);
}
function validate() {
  const name = $('name').value.trim();
  const id = $('studentId').value.trim();
  const nameError = !name ? '请输入姓名。' : name.length > 20 ? '姓名长度不能超过20个字符。' : '';
  const idError = /^[A-Za-z0-9]{4,20}$/.test(id) ? '' : '学号须为4–20位数字或英文字母。';
  $('nameError').textContent = nameError;
  $('idError').textContent = idError;
  $('name').setAttribute('aria-invalid',String(!!nameError));
  $('studentId').setAttribute('aria-invalid',String(!!idError));
  if(nameError || idError) {
    $(nameError ? 'name' : 'studentId').focus();
    return false;
  }
  player = {name,id};
  return true;
}
function startGame() {
  stopTimer();
  selectedQuestions = drawQuestions();
  records = [];
  index = 0;
  showScreen('quiz');
  renderQuestion();
}
function updateTimer(seconds) {
  $('seconds').textContent = seconds;
  $('timeBar').style.width = (100 * seconds / TIME_LIMIT) + '%';
  $('timerProgress').setAttribute('aria-valuemax',TIME_LIMIT);
  $('timerProgress').setAttribute('aria-valuenow',seconds);
  $('timer').classList.toggle('urgent',seconds <= 10);
  $('timeBar').classList.toggle('urgent',seconds <= 10);
}
function tick() {
  if(locked) return;
  const remaining = Math.max(0,Math.ceil((deadline-Date.now())/1000));
  updateTimer(remaining);
  if(remaining === 0) revealAnswer(null);
}
// 每道题独立重置倒计时；时间以实际截止时间为准。
function renderQuestion() {
  stopTimer();
  locked = false;
  const q = selectedQuestions[index];
  $('questionProgress').textContent = '当前第 '+(index+1)+' / '+count+' 题';
  $('questionText').textContent = q.question;
  $('options').replaceChildren();
  $('reveal').hidden = true;
  $('timer').classList.remove('stopped');
  q.options.forEach((option,i) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'option';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = letters[i];
    const content = document.createElement('span');
    content.className = 'option-text';
    content.textContent = option;
    button.append(letter,content);
    button.addEventListener('click',() => revealAnswer(letters[i]));
    $('options').appendChild(button);
  });
  updateTimer(TIME_LIMIT);
  deadline = Date.now() + TIME_LIMIT*1000;
  intervalId = setInterval(tick,1000);
  window.scrollTo(0,0);
}
// 超时与选择共用一次性锁定逻辑，防止重复得分。
function revealAnswer(answer) {
  if(locked) return;
  if(Date.now() >= deadline) {
    answer = null;
    updateTimer(0);
  }
  locked = true;
  stopTimer();
  $('timer').classList.add('stopped');
  const q = selectedQuestions[index];
  const correct = answer === q.answer;
  records.push({question:q,answer,correct});
  Array.from($('options').children).forEach((button,i) => {
    button.disabled = true;
    if(letters[i] === q.answer) button.classList.add('correct');
    else if(letters[i] === answer) button.classList.add('wrong');
  });
  $('correctAnswer').textContent = '正确答案：'+q.answer;
  $('earned').textContent = '本题得分：'+(correct ? POINTS : 0)+' 分';
  $('feedback').textContent = answer === null ? '未作答（超时）' : correct ? '回答正确' : '回答错误';
  $('explanation').textContent = q.explanation;
  $('reveal').hidden = false;
  $('explanation').scrollTop = 0;
  $('next').textContent = index === count-1 ? '查看成绩' : '下一题';
}
function showResults() {
  stopTimer();
  const correct = records.filter(record => record.correct).length;
  const score = correct * POINTS;
  $('resultName').textContent = player.name;
  $('resultId').textContent = player.id;
  $('totalScore').textContent = score;
  $('maxScore').textContent = ' / '+count*POINTS;
  $('detailList').replaceChildren();
  records.forEach((record,i) => {
    const row = document.createElement('details');
    row.className = 'detail-row';
    const toggle = document.createElement('summary');
    toggle.className = 'review-toggle';
    const heading = document.createElement('div');
    heading.className = 'detail-title';
    const number = document.createElement('span');
    number.className = 'detail-no';
    number.textContent = String(i+1).padStart(2,'0');
    const summary = document.createElement('span');
    summary.className = 'summary';
    summary.textContent = record.question.question;
    summary.title = record.question.question;
    const badge = document.createElement('span');
    badge.className = record.correct ? 'badge' : 'badge bad';
    badge.textContent = record.answer === null ? '未作答' : record.correct ? '正确' : '错误';
    heading.append(number,summary,badge);
    const answers = document.createElement('p');
    answers.className = 'detail-answer';
    answers.textContent = '你的答案：'+(record.answer ?? '未作答（超时）')+'　正确答案：'+record.question.answer;
    toggle.append(heading,answers);
    const review = document.createElement('div');
    review.className = 'review-content';
    const options = document.createElement('div');
    options.className = 'review-options';
    record.question.options.forEach((option,j) => {
      const item = document.createElement('div');
      item.className = 'review-option';
      const letter = letters[j];
      item.textContent = letter + '. ' + option;
      if(letter === record.question.answer) {
        item.classList.add('review-correct');
        item.textContent += '（正确答案）';
      }
      if(letter === record.answer) {
        item.classList.add('review-selected');
        item.textContent += '（你的选择）';
      }
      options.appendChild(item);
    });
    const explanation = document.createElement('p');
    explanation.className = 'review-explanation';
    const label = document.createElement('strong');
    label.textContent = '题目解析';
    const explanationText = document.createElement('span');
    explanationText.textContent = record.question.explanation;
    explanation.append(label,explanationText);
    review.append(options,explanation);
    row.append(toggle,review);
    $('detailList').appendChild(row);
  });
  showScreen('results');
}
// 绑定四个页面间的操作。
$('start').addEventListener('click',() => showScreen('registration'));
function enterQuiz() {
  if(!$('registration').hidden && validate()) {
    startGame();
  }
}
$('enterQuiz').addEventListener('click',enterQuiz);
['name','studentId'].forEach(id => {
  $(id).addEventListener('keydown',event => {
    if(event.key === 'Enter' && !event.isComposing) {
      event.preventDefault();
      enterQuiz();
    }
  });
});
$('next').addEventListener('click',() => {
  if(!locked) return;
  if(index < count-1) {
    index++;
    renderQuestion();
  } else showResults();
});
// 切换回页面时立即按实际时间校准倒计时。
document.addEventListener('visibilitychange',() => {
  if(!document.hidden && !$('quiz').hidden && !locked) tick();
});
</script>
</body>
